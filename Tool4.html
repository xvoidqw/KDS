<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кухонний Дисплей - Рецепти</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Автоматичне перемикання теми на основі налаштувань девайса
            theme: {
                extend: {
                    colors: {
                        kitchen: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome для іконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <div class="min-h-full flex flex-col">
        
        <!-- Header / Search Bar -->
        <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-4 sm:px-8">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div class="bg-orange-500 text-white p-3 rounded-2xl shadow-md">
                        <i class="fa-solid fa-utensils text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Кухонний Дисплей</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Інтерактивна книга рецептів</p>
                    </div>
                </div>

                <!-- Search and Add Button -->
                <div class="flex items-center gap-3 w-full sm:w-auto flex-1 max-w-xl justify-end">
                    <div class="relative flex-1 sm:max-w-md">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Пошук рецептів за назвою..." 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 dark:focus:border-orange-500 rounded-2xl text-sm focus:outline-none transition-all">
                    </div>
                    <button onclick="openAddModal()" class="flex items-center gap-2 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-5 py-2.5 rounded-2xl font-medium text-sm shadow-lg shadow-orange-500/25 transition-all whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i>
                        <span>Додати рецепт</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8">
            <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Динамічно заповнюється карток рецептів -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-slate-200 dark:bg-slate-800 rounded-3xl flex items-center justify-center text-slate-400 text-3xl mb-4">
                    <i class="fa-solid fa-bowl-food"></i>
                </div>
                <h3 class="text-lg font-semibold mb-1">Рецептів не знайдено</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm mb-6">Створіть свій перший кулінарний шедевр, натиснувши кнопку нижче.</p>
                <button onclick="openAddModal()" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2.5 rounded-2xl font-medium text-sm transition-all">
                    Додати рецепт
                </button>
            </div>
        </main>
    </div>

    <!-- Modal: Add Recipe Wizard -->
    <div id="addModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 flex flex-col max-h-[90vh]">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <h3 id="wizardModalTitle" class="text-lg font-bold">Створення рецепта (Крок 1 з 2)</h3>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body Content -->
            <div class="p-6 overflow-y-auto flex-1" id="wizardBody">
                <!-- Динамічний вміст майстра -->
            </div>
        </div>
    </div>

    <!-- Modal: View Simple Recipe -->
    <div id="viewSimpleModal" class="fixed inset-0 z-50 hidden bg-white dark:bg-slate-900 w-full h-full flex flex-col m-0 p-0 rounded-none border-0">
        <div class="px-8 py-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/80">
            <h3 id="simpleViewTitle" class="text-2xl font-bold">Назва рецепта</h3>
            <button onclick="closeSimpleModal()" class="w-12 h-12 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="p-12 overflow-y-auto flex-1 max-w-5xl mx-auto w-full">
            <p id="simpleViewDesc" class="text-slate-700 dark:text-slate-200 whitespace-pre-line text-xl leading-relaxed"></p>
        </div>
        <div class="px-8 py-6 border-t border-slate-200 dark:border-slate-800 flex justify-end bg-slate-50 dark:bg-slate-800/80">
            <button onclick="closeSimpleModal()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 px-8 py-3 rounded-2xl font-medium text-base transition-all">Закрити дисплей</button>
        </div>
    </div>

    <!-- Modal: View Interactive Recipe Player -->
    <div id="viewInteractiveModal" class="fixed inset-0 z-50 hidden bg-white dark:bg-slate-900 w-full h-full flex flex-col m-0 p-0 rounded-none border-0">
        <!-- Top info bar -->
        <div class="px-8 py-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/80">
            <div>
                <span id="playerRecipeCategory" class="text-xs font-semibold text-orange-500 uppercase tracking-wider">Інтерактивний процес</span>
                <h3 id="playerRecipeTitle" class="text-2xl font-bold">Назва рецепта</h3>
            </div>
            <button onclick="closeInteractiveModal()" class="w-12 h-12 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Step content container -->
        <div class="p-10 overflow-y-auto flex-1 flex flex-col justify-between max-w-5xl mx-auto w-full" id="playerStepContainer">
            <!-- Динамічний плеєр кроків -->
        </div>
    </div>

    <script>
        // Початкові приклади рецептів у пам'яті (порожній масив)
        let recipes = [];

        // Змінні для стану створення рецепта
        let newRecipeDraft = {
            title: '',
            description: '',
            type: 'simple', // 'simple' або 'interactive'
            content: '',
            steps: []
        };

        // Тимчасовий крок під час створення інтерактивного рецепта
        let currentStepDraft = {
            title: '',
            description: '',
            actionType: '1', // 1, 2, 3, 4
            internalTime: 0,
            externalTime: 0,
            requireManualConfirm: false
        };

        // Стан активного плеєра
        let activePlayer = {
            recipe: null,
            currentStepIndex: 0,
            timerInterval: null,
            timeLeft: 0,
            externalTimeLeft: 0,
            timerRunning: false,
            externalTimerRunning: false,
            externalInterval: null
        };

        // Аудіо-сповіщення (вбудований синтезатор звуку через Web Audio API без зовнішніх файлів)
        function playBeep(frequency = 587.33, duration = 0.2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function playCompletionMelody() {
            playBeep(523.25, 0.15);
            setTimeout(() => playBeep(659.25, 0.15), 150);
            setTimeout(() => playBeep(783.99, 0.3), 300);
        }

        // Ініціалізація при завантаженні
        document.addEventListener('DOMContentLoaded', () => {
            renderRecipes();
        });

        // Головна функція рендерингу сітки рецептів
        function renderRecipes(filterText = '') {
            const grid = document.getElementById('recipeGrid');
            const emptyState = document.getElementById('emptyState');

            const filtered = recipes.filter(r => r.title.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.remove('flex');
            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map((recipe, index) => `
                <div onclick="openRecipe(${index})" class="group bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm hover:shadow-xl border border-slate-200 dark:border-slate-700 cursor-pointer transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/5 rounded-full blur-2xl group-hover:bg-orange-500/10 transition-all"></div>
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${recipe.type === 'interactive' ? 'bg-orange-100 dark:bg-orange-950/60 text-orange-600 dark:text-orange-400' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">
                                <i class="fa-solid ${recipe.type === 'interactive' ? 'fa-bolt' : 'fa-align-left'} mr-1"></i>
                                ${recipe.type === 'interactive' ? 'Інтерактивний' : 'Простий текст'}
                            </span>
                            <button onclick="event.stopPropagation(); deleteRecipe(${index})" class="w-8 h-8 rounded-full hover:bg-red-50 dark:hover:bg-red-950/40 text-slate-400 hover:text-red-500 flex items-center justify-center transition-colors">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                        <h3 class="text-lg font-bold mb-2 group-hover:text-orange-500 transition-colors">${escapeHtml(recipe.title)}</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400 line-clamp-2 mb-4">${escapeHtml(recipe.description || 'Без опису')}</p>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-700/60 text-xs text-slate-400 font-medium">
                        <span>${recipe.type === 'interactive' ? `${recipe.steps.length} кроків виконання` : 'Текстовий рецепт'}</span>
                        <span class="text-orange-500 flex items-center gap-1 group-hover:translate-x-1 transition-transform">Відкрити <i class="fa-solid fa-arrow-right text-[10px]"></i></span>
                    </div>
                </div>
            `).join('');
        }

        // Пошук
        function filterRecipes() {
            const query = document.getElementById('searchInput').value;
            renderRecipes(query);
        }

        // Видалення рецепта
        function deleteRecipe(index) {
            recipes.splice(index, 1);
            renderRecipes(document.getElementById('searchInput').value);
            showNotification('Рецепт успішно видалено', 'success');
        }

        // Мастер додавання рецепта - Крок 1
        function openAddModal() {
            newRecipeDraft = { title: '', description: '', type: 'simple', content: '', steps: [] };
            const modal = document.getElementById('addModal');
            modal.classList.remove('hidden');
            renderWizardStep1();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function renderWizardStep1() {
            document.getElementById('wizardModalTitle').innerText = 'Створення рецепта (Крок 1 з 2)';
            const body = document.getElementById('wizardBody');
            body.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Назва рецепта</label>
                        <input type="text" id="draftTitle" value="${escapeHtml(newRecipeDraft.title)}" placeholder="Наприклад: Борч український" 
                            class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Короткий опис</label>
                        <textarea id="draftDesc" rows="3" placeholder="Короткий опис або особливості..." 
                            class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none transition-all">${escapeHtml(newRecipeDraft.description)}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Тип рецепта</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="flex items-center gap-3 p-4 rounded-2xl border-2 cursor-pointer transition-all ${newRecipeDraft.type === 'simple' ? 'border-orange-500 bg-orange-500/5' : 'border-slate-200 dark:border-slate-700'}">
                                <input type="radio" name="recipeType" value="simple" ${newRecipeDraft.type === 'simple' ? 'checked' : ''} onchange="setRecipeType('simple')" class="text-orange-500 focus:ring-orange-500">
                                <div>
                                    <div class="font-bold text-sm">Простий текст</div>
                                    <div class="text-xs text-slate-500">Звичайний опис рецепта</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-3 p-4 rounded-2xl border-2 cursor-pointer transition-all ${newRecipeDraft.type === 'interactive' ? 'border-orange-500 bg-orange-500/5' : 'border-slate-200 dark:border-slate-700'}">
                                <input type="radio" name="recipeType" value="interactive" ${newRecipeDraft.type === 'interactive' ? 'checked' : ''} onchange="setRecipeType('interactive')" class="text-orange-500 focus:ring-orange-500">
                                <div>
                                    <div class="font-bold text-sm">Інтерактивний</div>
                                    <div class="text-xs text-slate-500">Покрокові таймери та дії</div>
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="pt-4 flex justify-end">
                        <button onclick="submitWizardStep1()" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2.5 rounded-2xl font-medium text-sm shadow-lg shadow-orange-500/20 transition-all">Далі</button>
                    </div>
                </div>
            `;
        }

        function setRecipeType(type) {
            newRecipeDraft.type = type;
        }

        function submitWizardStep1() {
            const title = document.getElementById('draftTitle').value.trim();
            const desc = document.getElementById('draftDesc').value.trim();

            if (!title) {
                showNotification('Будь ласка, введіть назву рецепта', 'error');
                return;
            }

            newRecipeDraft.title = title;
            newRecipeDraft.description = desc;

            if (newRecipeDraft.type === 'simple') {
                renderWizardSimpleContent();
            } else {
                // Починаємо створення першого кроку
                currentStepDraft = { title: '', description: '', actionType: '1', internalTime: 60, externalTime: 120, requireManualConfirm: false };
                renderWizardInteractiveStep(1);
            }
        }

        // Рендеринг для простого рецепта
        function renderWizardSimpleContent() {
            document.getElementById('wizardModalTitle').innerText = 'Створення простого рецепта (Крок 2 з 2)';
            const body = document.getElementById('wizardBody');
            body.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Повний текст рецепта та інгредієнти</label>
                        <textarea id="draftContent" rows="8" placeholder="Опишіть повністю процес приготування..." 
                            class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none transition-all">${escapeHtml(newRecipeDraft.content)}</textarea>
                    </div>
                    <div class="pt-4 flex justify-between">
                        <button onclick="renderWizardStep1()" class="px-5 py-2.5 rounded-2xl font-medium text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">Назад</button>
                        <button onclick="saveSimpleRecipe()" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2.5 rounded-2xl font-medium text-sm shadow-lg shadow-orange-500/20 transition-all">Зберегти рецепт</button>
                    </div>
                </div>
            `;
        }

        function saveSimpleRecipe() {
            const content = document.getElementById('draftContent').value.trim();
            newRecipeDraft.content = content;
            recipes.push({...newRecipeDraft});
            closeAddModal();
            renderRecipes();
            showNotification('Рецепт успішно створено!', 'success');
        }

        // Рендеринг конструктора кроків для інтерактивного рецепта
        function renderWizardInteractiveStep(stepNumber) {
            document.getElementById('wizardModalTitle').innerText = `Крок ${stepNumber}: Конструктор дії`;
            const body = document.getElementById('wizardBody');
            body.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Назва кроку</label>
                        <input type="text" id="stepTitle" value="${escapeHtml(currentStepDraft.title)}" placeholder="Наприклад: Обсмаження цибулі" 
                            class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Опис кроку (за бажанням)</label>
                        <textarea id="stepDesc" rows="2" placeholder="Додаткові інструкції до цього кроку..." 
                            class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none transition-all">${escapeHtml(currentStepDraft.description)}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Тип дії кроку</label>
                        <div class="grid grid-cols-1 gap-3">
                            <label class="flex items-center gap-3 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${currentStepDraft.actionType === '1' ? 'border-orange-500 bg-orange-500/5' : 'border-slate-200 dark:border-slate-700'}">
                                <input type="radio" name="actionType" value="1" ${currentStepDraft.actionType === '1' ? 'checked' : ''} onchange="setActionType('1')" class="text-orange-500">
                                <div>
                                    <div class="font-bold text-sm">1. Дія із внутрішнім і зовнішнім таймером</div>
                                    <div class="text-xs text-slate-500">Виконання процесу під таймер + очікування результату</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-3 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${currentStepDraft.actionType === '2' ? 'border-orange-500 bg-orange-500/5' : 'border-slate-200 dark:border-slate-700'}">
                                <input type="radio" name="actionType" value="2" ${currentStepDraft.actionType === '2' ? 'checked' : ''} onchange="setActionType('2')" class="text-orange-500">
                                <div>
                                    <div class="font-bold text-sm">2. Дія із внутрішнім таймером</div>
                                    <div class="text-xs text-slate-500">Тільки виконання кроку під час відліку часу</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-3 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${currentStepDraft.actionType === '3' ? 'border-orange-500 bg-orange-500/5' : 'border-slate-200 dark:border-slate-700'}">
                                <input type="radio" name="actionType" value="3" ${currentStepDraft.actionType === '3' ? 'checked' : ''} onchange="setActionType('3')" class="text-orange-500">
                                <div>
                                    <div class="font-bold text-sm">3. Дія із зовнішнім таймером</div>
                                    <div class="text-xs text-slate-500">Очікування на готовність до наступного кроку</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-3 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${currentStepDraft.actionType === '4' ? 'border-orange-500 bg-orange-500/5' : 'border-slate-200 dark:border-slate-700'}">
                                <input type="radio" name="actionType" value="4" ${currentStepDraft.actionType === '4' ? 'checked' : ''} onchange="setActionType('4')" class="text-orange-500">
                                <div>
                                    <div class="font-bold text-sm">4. Дія із зовнішнім таймером та підтвердженням</div>
                                    <div class="text-xs text-slate-500">Очікування + ручне підтвердження початку внутрішньої дії</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Внутрішній таймер (сек)</label>
                            <input type="number" id="stepInternalTime" value="${currentStepDraft.internalTime}" min="0" 
                                class="w-full px-4 py-2.5 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Зовнішній таймер (сек)</label>
                            <input type="number" id="stepExternalTime" value="${currentStepDraft.externalTime}" min="0" 
                                class="w-full px-4 py-2.5 bg-slate-100 dark:bg-slate-700/60 border border-transparent focus:border-orange-500 rounded-2xl text-sm focus:outline-none">
                        </div>
                    </div>

                    <div class="pt-4 flex items-center justify-between border-t border-slate-200 dark:border-slate-700">
                        <span class="text-xs text-slate-400 font-medium">Всього кроків створено: ${newRecipeDraft.steps.length}</span>
                        <div class="flex gap-2">
                            <button onclick="saveAndAddAnotherStep()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 px-4 py-2.5 rounded-2xl font-medium text-xs transition-all">+ Додати ще крок</button>
                            <button onclick="finishInteractiveRecipe()" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2.5 rounded-2xl font-medium text-xs shadow-lg shadow-orange-500/20 transition-all">Завершити рецепт</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setActionType(type) {
            currentStepDraft.actionType = type;
        }

        function collectCurrentStepData() {
            currentStepDraft.title = document.getElementById('stepTitle').value.trim();
            currentStepDraft.description = document.getElementById('stepDesc').value.trim();
            currentStepDraft.internalTime = parseInt(document.getElementById('stepInternalTime').value) || 0;
            currentStepDraft.externalTime = parseInt(document.getElementById('stepExternalTime').value) || 0;
            currentStepDraft.actionType = document.querySelector('input[name="actionType"]:checked').value;

            // Налаштовуємо прапорці підтвердження залежно від типу
            if (currentStepDraft.actionType === '4') {
                currentStepDraft.requireManualConfirm = true;
            } else {
                currentStepDraft.requireManualConfirm = false;
            }
        }

        function saveAndAddAnotherStep() {
            collectCurrentStepData();
            if (!currentStepDraft.title) {
                showNotification('Введіть назву поточного кроку', 'error');
                return;
            }

            newRecipeDraft.steps.push({...currentStepDraft});
            // Скидаємо для наступного кроку
            currentStepDraft = { title: '', description: '', actionType: '1', internalTime: 60, externalTime: 120, requireManualConfirm: false };
            renderWizardInteractiveStep(newRecipeDraft.steps.length + 1);
            showNotification('Крок додано до рецепта', 'success');
        }

        function finishInteractiveRecipe() {
            collectCurrentStepData();
            if (currentStepDraft.title) {
                newRecipeDraft.steps.push({...currentStepDraft});
            }

            if (newRecipeDraft.steps.length === 0) {
                showNotification('Додайте хоча б один крок до рецепта', 'error');
                return;
            }

            recipes.push({...newRecipeDraft});
            closeAddModal();
            renderRecipes();
            showNotification('Інтерактивний рецепт створено успішно!', 'success');
        }

        // Відкриття рецепта залежно від типу
        function openRecipe(index) {
            const recipe = recipes[index];
            if (!recipe) return;

            if (recipe.type === 'simple') {
                document.getElementById('simpleViewTitle').innerText = recipe.title;
                document.getElementById('simpleViewDesc').innerText = recipe.content || 'Опис відсутній.';
                const modal = document.getElementById('viewSimpleModal');
                modal.classList.remove('hidden');
            } else {
                activePlayer.recipe = recipe;
                activePlayer.currentStepIndex = 0;
                stopTimer();
                document.getElementById('playerRecipeTitle').innerText = recipe.title;
                const modal = document.getElementById('viewInteractiveModal');
                modal.classList.remove('hidden');
                renderInteractivePlayerStep();
            }
        }

        function closeSimpleModal() {
            document.getElementById('viewSimpleModal').classList.add('hidden');
        }

        function closeInteractiveModal() {
            stopTimer();
            document.getElementById('viewInteractiveModal').classList.add('hidden');
        }

        // Інтерактивний плеєр кроків
        function renderInteractivePlayerStep() {
            const recipe = activePlayer.recipe;
            const idx = activePlayer.currentStepIndex;
            const step = recipe.steps[idx];
            const container = document.getElementById('playerStepContainer');

            if (!step) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center py-20 flex-1">
                        <div class="w-24 h-24 bg-green-100 dark:bg-green-950/60 text-green-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-xl shadow-green-500/10">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h3 class="text-3xl font-bold mb-3">Смачного! Рецепт завершено</h3>
                        <p class="text-base text-slate-500 dark:text-slate-400 mb-8 max-w-md">Ви успішно виконали всі кроки рецепта "${escapeHtml(recipe.title)}".</p>
                        <button onclick="closeInteractiveModal()" class="bg-orange-500 hover:bg-orange-600 text-white px-10 py-4 rounded-2xl font-medium text-base transition-all shadow-xl shadow-orange-500/25">Закрити дисплей</button>
                    </div>
                `;
                return;
            }

            let progressDots = recipe.steps.map((s, i) => `
                <div class="h-2.5 flex-1 rounded-full ${i < idx ? 'bg-orange-500' : (i === idx ? 'bg-orange-400 animate-pulse' : 'bg-slate-200 dark:bg-slate-800')}"></div>
            `).join('');

            let showInternalTimer = (step.actionType === '1' || step.actionType === '2') && step.internalTime > 0;
            let showExternalTimer = (step.actionType === '1' || step.actionType === '3' || step.actionType === '4') && step.externalTime > 0;
            let needConfirmation = step.actionType === '4';

            container.innerHTML = `
                <div>
                    <div class="flex items-center gap-3 mb-8">
                        ${progressDots}
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <span class="bg-orange-100 dark:bg-orange-950/60 text-orange-600 dark:text-orange-400 text-xs px-3.5 py-1.5 rounded-full font-bold">Крок ${idx + 1} із ${recipe.steps.length}</span>
                        <span class="text-xs text-slate-400 font-medium">Тип: ${getStepTypeName(step.actionType)}</span>
                    </div>

                    <h2 class="text-4xl font-bold mb-4">${escapeHtml(step.title)}</h2>
                    <p class="text-xl text-slate-600 dark:text-slate-300 leading-relaxed mb-10">${escapeHtml(step.description || 'Немає детального опису до цього кроку.')}</p>
                    
                    <div id="timerSection" class="grid grid-cols-1 sm:grid-cols-2 gap-8 mb-8">
                        ${showInternalTimer ? `
                            <div class="p-8 rounded-3xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-xs font-semibold text-slate-400 uppercase"><i class="fa-solid fa-hourglass-half mr-1"></i> Внутрішній таймер (Виконання)</span>
                                    <span id="internalTimeDisplay" class="text-3xl font-bold font-mono">${formatTime(step.internalTime)}</span>
                                </div>
                                <div class="text-xs text-orange-500 font-medium mt-2" id="internalStatus">Відлік до кінця виконання кроку</div>
                            </div>
                        ` : ''}

                        ${showExternalTimer ? `
                            <div class="p-8 rounded-3xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-xs font-semibold text-slate-400 uppercase"><i class="fa-regular fa-clock mr-1"></i> Зовнішній таймер (Очікування)</span>
                                    <span id="externalTimeDisplay" class="text-3xl font-bold font-mono">${formatTime(step.externalTime)}</span>
                                </div>
                                <div class="flex items-center justify-between mt-4">
                                    <span class="text-xs text-blue-500 font-medium" id="externalStatus">Відлік вниз до закінчення очікування</span>
                                    <button onclick="stopExternalTimerManual()" id="stopExternalBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all shadow-md">Зупинити очікування</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    ${needConfirmation ? `
                        <div id="confirmSection" class="p-6 rounded-3xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/50 mb-8 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl"></i>
                                <div>
                                    <div class="font-bold text-base text-amber-800 dark:text-amber-200">Потрібно підтвердження</div>
                                    <div class="text-sm text-amber-600 dark:text-amber-400">Натисніть кнопку, щоб запустити внутрішній таймер.</div>
                                </div>
                            </div>
                            <button onclick="confirmAndStartInternal(${step.internalTime})" id="confirmBtn" class="bg-amber-500 hover:bg-amber-600 text-white px-8 py-3.5 rounded-2xl font-medium text-sm shadow-lg shadow-amber-500/20 transition-all whitespace-nowrap">Підтвердити і запустити</button>
                        </div>
                    ` : ''}
                </div>

                <!-- Footer Navigation -->
                <div class="pt-8 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <button onclick="prevStep()" ${idx === 0 ? 'disabled' : ''} class="px-8 py-4 rounded-2xl text-base font-medium hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors">Попередній крок</button>
                    <button onclick="nextStep()" class="bg-orange-500 hover:bg-orange-600 text-white px-10 py-4 rounded-2xl text-base font-medium shadow-xl shadow-orange-500/25 transition-all">Наступний крок</button>
                </div>
            `;

            // Логіка запуску таймерів за типами
            if (step.actionType === '1') {
                if (step.internalTime > 0) {
                    startInternalWithSound(step.internalTime, () => {
                        if (step.externalTime > 0) {
                            startCountdownExternalTimer('externalTimeDisplay', step.externalTime);
                        }
                    });
                } else if (step.externalTime > 0) {
                    startCountdownExternalTimer('externalTimeDisplay', step.externalTime);
                }
            } else if (step.actionType === '2' && step.internalTime > 0) {
                startInternalWithSound(step.internalTime, null);
            } else if (step.actionType === '3' && step.externalTime > 0) {
                startCountdownExternalTimer('externalTimeDisplay', step.externalTime);
            } else if (step.actionType === '4' && step.externalTime > 0) {
                startCountdownExternalTimer('externalTimeDisplay', step.externalTime);
            }
        }

        function getStepTypeName(type) {
            switch(type) {
                case '1': return 'Внутрішній + Зовнішній таймер';
                case '2': return 'Внутрішній таймер';
                case '3': return 'Зовнішній таймер';
                case '4': return 'Зовнішній + Підтвердження';
                default: return 'Стандартна дія';
            }
        }

        // Внутрішній таймер із звуковими сигналами (іде вниз, зупиняється автоматично)
        function startInternalWithSound(seconds, onCompleteCallback) {
            stopTimer();
            activePlayer.timeLeft = seconds;
            activePlayer.timerRunning = true;

            activePlayer.timerInterval = setInterval(() => {
                if (activePlayer.timeLeft > 0) {
                    activePlayer.timeLeft--;
                    const el = document.getElementById('internalTimeDisplay');
                    if (el) el.innerText = formatTime(activePlayer.timeLeft);

                    if (activePlayer.timeLeft <= 3 && activePlayer.timeLeft > 0) {
                        playBeep(440, 0.1);
                    }
                } else {
                    stopTimer();
                    playCompletionMelody();
                    const statusEl = document.getElementById('internalStatus');
                    if (statusEl) statusEl.innerText = 'Внутрішній таймер завершено!';
                    showNotification('Внутрішній таймер завершено!', 'success');
                    if (typeof onCompleteCallback === 'function') {
                        onCompleteCallback();
                    }
                }
            }, 1000);
        }

        // Зовнішній таймер: тепер іде ВНИЗ (зворотний відлік очікування), поки користувач сам не зупинить або не закінчиться час
        function startCountdownExternalTimer(displayId, initialSeconds) {
            stopExternalTimer();
            activePlayer.externalTimeLeft = initialSeconds;
            activePlayer.externalTimerRunning = true;

            activePlayer.externalInterval = setInterval(() => {
                if (activePlayer.externalTimerRunning) {
                    if (activePlayer.externalTimeLeft > 0) {
                        activePlayer.externalTimeLeft--;
                        const el = document.getElementById(displayId);
                        if (el) el.innerText = formatTime(activePlayer.externalTimeLeft);

                        if (activePlayer.externalTimeLeft === 0) {
                            playCompletionMelody();
                            const statusEl = document.getElementById('externalStatus');
                            if (statusEl) statusEl.innerText = 'Час очікування вичерпано!';
                        }
                    }
                }
            }, 1000);
        }

        function stopExternalTimerManual() {
            stopExternalTimer();
            playBeep(650, 0.2);
            const statusEl = document.getElementById('externalStatus');
            if (statusEl) statusEl.innerText = 'Очікування зупинено користувачем.';
            const btn = document.getElementById('stopExternalBtn');
            if (btn) {
                btn.innerText = 'Зупинено ✓';
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btn.classList.add('bg-green-600');
            }
            showNotification('Очікування завершено', 'success');
        }

        function confirmAndStartInternal(intSec) {
            const btn = document.getElementById('confirmBtn');
            if (btn) {
                btn.innerText = 'Підтверджено ✓';
                btn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
                btn.classList.add('bg-green-500');
            }
            showNotification('Внутрішній таймер запущено!', 'success');
            if (intSec > 0) {
                startInternalWithSound(intSec, null);
            }
        }

        function stopTimer() {
            if (activePlayer.timerInterval) {
                clearInterval(activePlayer.timerInterval);
                activePlayer.timerInterval = null;
            }
            activePlayer.timerRunning = false;
        }

        function stopExternalTimer() {
            if (activePlayer.externalInterval) {
                clearInterval(activePlayer.externalInterval);
                activePlayer.externalInterval = null;
            }
            activePlayer.externalTimerRunning = false;
        }

        function nextStep() {
            stopTimer();
            stopExternalTimer();
            activePlayer.currentStepIndex++;
            renderInteractivePlayerStep();
        }

        function prevStep() {
            if (activePlayer.currentStepIndex > 0) {
                stopTimer();
                stopExternalTimer();
                activePlayer.currentStepIndex--;
                renderInteractivePlayerStep();
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // Утиліта для сповіщень
        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `fixed bottom-6 right-6 z-50 px-5 py-3 rounded-2xl shadow-xl text-white text-sm font-medium flex items-center gap-3 transition-all transform translate-y-2 opacity-0 ${type === 'error' ? 'bg-red-500' : 'bg-slate-900 dark:bg-slate-700 border border-slate-700'}`;
            notif.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation text-white' : 'fa-circle-check text-orange-400'}"></i> <span>${escapeHtml(message)}</span>`;
            document.body.appendChild(notif);

            setTimeout(() => {
                notif.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                notif.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
