<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепти</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {}
            }
        }
    </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col">

    <!-- Верхня панель -->
    <header class="bg-white dark:bg-gray-800 shadow p-4 flex flex-wrap justify-between items-center gap-4">
        <h1 id="ui-title" class="text-2xl font-bold">Рецепти</h1>
        
        <div class="flex items-center gap-3 flex-1 max-w-md">
            <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Пошук рецептів..." 
                class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center gap-3">
            <!-- Селектор мови (власне меню) -->
            <select id="langSelect" onchange="changeLanguage(this.value)" class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 focus:outline-none">
                <option value="uk">Українська</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
                <option value="pl">Polski</option>
                <option value="pt">Português</option>
                <option value="tr">Türkçe</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="ko">한국어</option>
            </select>

            <button onclick="openAddModal()" id="ui-add-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                + Додати рецепт
            </button>
        </div>
    </header>

    <!-- Основний контент (Сітка рецептів) -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div id="recipesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Динамічні картки -->
        </div>
        <div id="noRecipesText" class="text-center text-gray-500 dark:text-gray-400 mt-20 text-xl hidden">
            Немає рецептів. Додайте перший!
        </div>
    </main>

    <!-- Модальне вікно створення рецепта (Крок 1) -->
    <div id="addModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <h2 id="ui-modal-title" class="text-xl font-bold mb-4">Створення рецепта</h2>
            
            <div class="space-y-4">
                <div>
                    <label id="ui-label-name" class="block text-sm font-medium mb-1">Назва рецепта</label>
                    <input type="text" id="newRecipeName" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent">
                </div>
                <div>
                    <label id="ui-label-desc" class="block text-sm font-medium mb-1">Опис рецепта</label>
                    <textarea id="newRecipeDesc" rows="3" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent"></textarea>
                </div>
                <div>
                    <label id="ui-label-type" class="block text-sm font-medium mb-1">Тип рецепта</label>
                    <select id="newRecipeType" onchange="toggleRecipeTypeInputs()" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent">
                        <option value="simple" id="ui-type-simple">Простий текст</option>
                        <option value="interactive" id="ui-type-interactive">Інтерактивний рецепт</option>
                    </select>
                </div>

                <!-- Блок для простого тексту -->
                <div id="simpleContentContainer">
                    <label id="ui-label-fulltext" class="block text-sm font-medium mb-1">Повний текст опису</label>
                    <textarea id="newRecipeFullText" rows="5" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeAddModal()" id="ui-btn-cancel" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 font-medium">Скасувати</button>
                <button onclick="handleNextStep()" id="ui-btn-next" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium">Далі</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно для додавання кроків інтерактивного рецепта -->
    <div id="stepModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <h2 id="ui-step-modal-title" class="text-xl font-bold mb-4">Додати крок рецепта</h2>
            
            <div class="space-y-4">
                <div>
                    <label id="ui-step-name-label" class="block text-sm font-medium mb-1">Назва кроку</label>
                    <input type="text" id="stepName" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent">
                </div>
                <div>
                    <label id="ui-step-desc-label" class="block text-sm font-medium mb-1">Опис кроку (за бажанням)</label>
                    <textarea id="stepDesc" rows="2" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent"></textarea>
                </div>
                <div>
                    <label id="ui-step-action-type" class="block text-sm font-medium mb-1">Тип дії кроку</label>
                    <select id="stepActionType" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent">
                        <option value="1" id="ui-act-1">1. Дія із внутрішнім і зовнішнім таймером</option>
                        <option value="2" id="ui-act-2">2. Дія із внутрішнім таймером</option>
                        <option value="3" id="ui-act-3">3. Дія із зовнішнім таймером</option>
                        <option value="4" id="ui-act-4">4. Дія із зовнішнім таймером та підтвердженням для внутрішнього</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="saveStepAndAddAnother()" id="ui-btn-add-another" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 font-medium">+ Додати крок</button>
                <button onclick="finishInteractiveRecipe()" id="ui-btn-finish" class="px-4 py-2 rounded-lg bg-green-600 text-white font-medium">Завершити</button>
            </div>
        </div>
    </div>

    <!-- Повноекранний перегляд рецепта -->
    <div id="viewModal" class="fixed inset-0 bg-white dark:bg-gray-900 z-50 hidden flex flex-col">
        <header class="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
            <h2 id="viewTitle" class="text-2xl font-bold"></h2>
            <button onclick="closeViewModal()" id="ui-btn-close" class="text-lg font-bold px-4 py-2 bg-gray-200 dark:bg-gray-800 rounded-lg">✕</button>
        </header>
        <div id="viewContent" class="flex-1 p-8 overflow-y-auto max-w-4xl mx-auto w-full flex flex-col justify-center">
            <!-- Динамічний вміст перегляду -->
        </div>
    </div>

                stepActionType: "단계 작업 유형",
                act1: "1. 내부 및 외부 타이머가 있는 작업",
                act2: "2. 내부 타이머가 있는 작업",
                act3: "3. 외부 타이머가 있는 작업",
                act4: "4. 외부 타이머 및 내부 확인이 있는 작업",
                addAnotherStep: "+ 단계 추가",
                finish: "완료",
                startInternal: "내부 타이머 시작",
                confirmInternal: "내부 타이머 확인",
                stopExternal: "외부 타이머 정지",
                nextStep: "다음 단계",
                completeRecipe: "레시피 완료!"
            }
        };

        let currentLang = 'uk';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations['uk'];

            document.getElementById('ui-title').innerText = t.appTitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('ui-add-btn').innerText = t.addBtn;
            document.getElementById('noRecipesText').innerText = t.noRecipes;
            document.getElementById('ui-modal-title').innerText = t.modalTitle;
            document.getElementById('ui-label-name').innerText = t.labelName;
            document.getElementById('ui-label-desc').innerText = t.labelDesc;
            document.getElementById('ui-label-type').innerText = t.labelType;
            document.getElementById('ui-type-simple').innerText = t.typeSimple;
            document.getElementById('ui-type-interactive').innerText = t.typeInteractive;
            document.getElementById('ui-label-fulltext').innerText = t.labelFullText;
            document.getElementById('ui-btn-cancel').innerText = t.cancel;
            document.getElementById('ui-btn-next').innerText = t.next;

            document.getElementById('ui-step-modal-title').innerText = t.stepModalTitle;
            document.getElementById('ui-step-name-label').innerText = t.stepNameLabel;
            document.getElementById('ui-step-desc-label').innerText = t.stepDescLabel;
            document.getElementById('ui-step-action-type').innerText = t.stepActionType;
            document.getElementById('ui-act-1').innerText = t.act1;
            document.getElementById('ui-act-2').innerText = t.act2;
            document.getElementById('ui-act-3').innerText = t.act3;
            document.getElementById('ui-act-4').innerText = t.act4;
            document.getElementById('ui-btn-add-another').innerText = t.addAnotherStep;
            document.getElementById('ui-btn-finish').innerText = t.finish;

            renderRecipes();
        }

        // Завантаження збережених рецептів з localStorage (порожньо за замовчуванням)
        let recipes = JSON.parse(localStorage.getItem('recipes')) || [];
        let tempRecipeData = null;
        let tempSteps = [];

        function saveToStorage() {
            localStorage.setItem('recipes', JSON.stringify(recipes));
        }

        function renderRecipes(filter = '') {
            const grid = document.getElementById('recipesGrid');
            const noText = document.getElementById('noRecipesText');
            grid.innerHTML = '';

            const filtered = recipes.filter(r => r.name.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                noText.classList.remove('hidden');
                return;
            } else {
                noText.classList.add('hidden');
            }

            filtered.forEach((recipe, index) => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 p-5 rounded-2xl shadow hover:shadow-lg transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => openViewModal(index);
                card.innerHTML = `
                    <div>
                        <h3 class="text-xl font-bold mb-2">${escapeHtml(recipe.name)}</h3>
                        <p class="text-gray-600 dark:text-gray-400 text-sm line-clamp-3">${escapeHtml(recipe.desc)}</p>
                    </div>
                    <div class="mt-4 flex justify-between items-center text-xs text-blue-500 font-medium">
                        <span>${recipe.type === 'simple' ? '📝' : '⚡'} ${recipe.type === 'simple' ? (translations[currentLang].typeSimple || 'Simple') : (translations[currentLang].typeInteractive || 'Interactive')}</span>
                        <button onclick="event.stopPropagation(); deleteRecipe(${index})" class="text-red-500 hover:underline">✕</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterRecipes() {
            const query = document.getElementById('searchInput').value;
            renderRecipes(query);
        }

        function openAddModal() {
            document.getElementById('newRecipeName').value = '';
            document.getElementById('newRecipeDesc').value = '';
            document.getElementById('newRecipeFullText').value = '';
            document.getElementById('newRecipeType').value = 'simple';
            toggleRecipeTypeInputs();
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function toggleRecipeTypeInputs() {
            const type = document.getElementById('newRecipeType').value;
            const simpleContainer = document.getElementById('simpleContentContainer');
            if (type === 'simple') {
                simpleContainer.classList.remove('hidden');
            } else {
                simpleContainer.classList.add('hidden');
            }
        }

        function handleNextStep() {
            const name = document.getElementById('newRecipeName').value.trim();
            const desc = document.getElementById('newRecipeDesc').value.trim();
            const type = document.getElementById('newRecipeType').value;

            if (!name) {
                alert('Введіть назву рецепта');
                return;
            }

            tempRecipeData = { name, desc, type };

            if (type === 'simple') {
                const fullText = document.getElementById('newRecipeFullText').value.trim();
                tempRecipeData.fullText = fullText;
                recipes.push(tempRecipeData);
                saveToStorage();
                closeAddModal();
                renderRecipes();
            } else {
                tempSteps = [];
                closeAddModal();
                openStepModal();
            }
        }

        function openStepModal() {
            document.getElementById('stepName').value = '';
            document.getElementById('stepDesc').value = '';
            document.getElementById('stepActionType').value = '1';
            document.getElementById('stepModal').classList.remove('hidden');
        }

        function closeStepModal() {
            document.getElementById('stepModal').classList.add('hidden');
        }

        function saveStepAndAddAnother() {
            const sName = document.getElementById('stepName').value.trim();
            const sDesc = document.getElementById('stepDesc').value.trim();
            const actionType = document.getElementById('stepActionType').value;

            if (!sName) {
                alert('Введіть назву кроку');
                return;
            }

            tempSteps.push({ name: sName, desc: sDesc, actionType });
            openStepModal(); // Очистити для наступного
        }

        function finishInteractiveRecipe() {
            const sName = document.getElementById('stepName').value.trim();
            const sDesc = document.getElementById('stepDesc').value.trim();
            const actionType = document.getElementById('stepActionType').value;

            if (sName) {
                tempSteps.push({ name: sName, desc: sDesc, actionType });
            }

            if (tempSteps.length === 0) {
                alert('Додайте хоча б один крок');
                return;
            }

            tempRecipeData.steps = tempSteps;
            recipes.push(tempRecipeData);
            saveToStorage();
            closeStepModal();
            renderRecipes();
        }

        function deleteRecipe(index) {
            if (confirm('Видалити цей рецепт?')) {
                recipes.splice(index, 1);
                saveToStorage();
                renderRecipes();
            }
        }

        // Звуковий сигнал через Web Audio API
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 587.33; // D5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.error(e);
            }
        }

        // Повноекранний перегляд
        let currentViewRecipe = null;
        let currentStepIndex = 0;

        function openViewModal(index) {
            currentViewRecipe = recipes[index];
            currentStepIndex = 0;
            document.getElementById('viewTitle').innerText = currentViewRecipe.name;
            document.getElementById('viewModal').classList.remove('hidden');
            renderViewContent();
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        function renderViewContent() {
            const container = document.getElementById('viewContent');
            const t = translations[currentLang] || translations['uk'];

            if (currentViewRecipe.type === 'simple') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <p class="text-lg text-gray-700 dark:text-gray-300 whitespace-pre-wrap">${escapeHtml(currentViewRecipe.fullText || currentViewRecipe.desc)}</p>
                    </div>
                `;
            } else {
                const steps = currentViewRecipe.steps;
                if (currentStepIndex >= steps.length) {
                    container.innerHTML = `
                        <div class="text-center space-y-4">
                            <h3 class="text-3xl font-bold text-green-500">${t.completeRecipe}</h3>
                            <button onclick="closeViewModal()" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold">OK</button>
                        </div>
                    `;
                    return;
                }

                const step = steps[currentStepIndex];
                let actionHtml = '';

                if (step.actionType === '1') {
                    // Внутрішній і зовнішній таймер
                    actionHtml = `
                        <div class="p-6 bg-blue-50 dark:bg-gray-800 rounded-2xl space-y-4 border border-blue-200 dark:border-gray-700">
                            <p class="font-medium text-blue-600 dark:text-blue-400">${t.act1}</p>
                            <div id="timerInternal1" class="text-xl font-bold">Внутрішній таймер: <span id="intTime1">5</span>с</div>
                            <div id="timerExternal1" class="text-xl font-bold hidden">Зовнішній таймер (Очікування): <span id="extTime1">10</span>с</div>
                            <button id="extStopBtn1" onclick="nextInteractiveStep()" class="hidden px-6 py-3 bg-red-600 text-white rounded-xl font-bold">${t.stopExternal}</button>
                        </div>
                    `;
                } else if (step.actionType === '2') {
                    // Тільки внутрішній таймер
                    actionHtml = `
                        <div class="p-6 bg-green-50 dark:bg-gray-800 rounded-2xl space-y-4 border border-green-200 dark:border-gray-700">
                            <p class="font-medium text-green-600 dark:text-green-400">${t.act2}</p>
                            <div class="text-xl font-bold">Внутрішній таймер: <span id="intTime2">5</span>с</div>
                        </div>
                    `;
                } else if (step.actionType === '3') {
                    // Тільки зовнішній таймер
                    actionHtml = `
                        <div class="p-6 bg-yellow-50 dark:bg-gray-800 rounded-2xl space-y-4 border border-yellow-200 dark:border-gray-700">
                            <p class="font-medium text-yellow-600 dark:text-yellow-400">${t.act3}</p>
                            <div class="text-xl font-bold">Зовнішній таймер (Очікування): <span id="extTime3">15</span>с</div>
                            <button onclick="nextInteractiveStep()" class="px-6 py-3 bg-red-600 text-white rounded-xl font-bold">${t.stopExternal}</button>
                        </div>
                    `;
                } else if (step.actionType === '4') {
                    // Зовнішній таймер + підтвердження для внутрішнього
                    actionHtml = `
                        <div class="p-6 bg-purple-50 dark:bg-gray-800 rounded-2xl space-y-4 border border-purple-200 dark:border-gray-700">
                            <p class="font-medium text-purple-600 dark:text-purple-400">${t.act4}</p>
                            <button onclick="startConfirmedInternal()" id="confirmInternalBtn" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold">${t.confirmInternal}</button>
                            <div id="confirmedInternalArea" class="hidden space-y-3">
                                <div class="text-xl font-bold">Внутрішній таймер: <span id="intTime4">5</span>с</div>
                            </div>
                            <div id="extTimerArea4" class="hidden space-y-3">
                                <div class="text-xl font-bold">Зовнішній таймер (Очікування): <span id="extTime4">15</span>с</div>
                                <button onclick="nextInteractiveStep()" class="px-6 py-3 bg-red-600 text-white rounded-xl font-bold">${t.stopExternal}</button>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center text-sm text-gray-500">
                            <span>${t.appTitle.slice(0,-1)} - ${t.step || 'Step'} ${currentStepIndex + 1} / ${steps.length}</span>
                        </div>
                        <h3 class="text-3xl font-bold">${escapeHtml(step.name)}</h3>
                        <p class="text-lg text-gray-600 dark:text-gray-300">${escapeHtml(step.desc || '')}</p>
                        ${actionHtml}
                    </div>
                `;

                // Автоматичний запуск таймерів залежно від типу кроку
                initStepTimers(step.actionType);
            }
        }

        function initStepTimers(actionType) {
            if (actionType === '1') {
                // Внутрішній автоматичний
                let sec = 5;
                const timerInterval = setInterval(() => {
                    sec--;
                    const el = document.getElementById('intTime1');
                    if (el) el.innerText = sec;
                    if (sec <= 0) {
                        clearInterval(timerInterval);
                        playBeep();
                        // Перехід до зовнішнього таймера вниз
                        document.getElementById('timerInternal1').classList.add('hidden');
                        document.getElementById('timerExternal1').classList.remove('hidden');
                        document.getElementById('extStopBtn1').classList.remove('hidden');
                        runExternalCountdown('extTime1');
                    }
                }, 1000);
            } else if (actionType === '2') {
                let sec = 5;
                const timerInterval = setInterval(() => {
                    sec--;
                    const el = document.getElementById('intTime2');
                    if (el) el.innerText = sec;
                    if (sec <= 0) {
                        clearInterval(timerInterval);
                        playBeep();
                        setTimeout(() => {
                            currentStepIndex++;
                            renderViewContent();
                        }, 1000);
                    }
                }, 1000);
            } else if (actionType === '3') {
                runExternalCountdown('extTime3');
            }
        }

        function startConfirmedInternal() {
            document.getElementById('confirmInternalBtn').classList.add('hidden');
            document.getElementById('confirmedInternalArea').classList.remove('hidden');
            let sec = 5;
            const timerInterval = setInterval(() => {
                sec--;
                const el = document.getElementById('intTime4');
                if (el) el.innerText = sec;
                if (sec <= 0) {
                    clearInterval(timerInterval);
                    playBeep();
                    document.getElementById('confirmedInternalArea').classList.add('hidden');
                    document.getElementById('extTimerArea4').classList.remove('hidden');
                    runExternalCountdown('extTime4');
                }
            }, 1000);
        }

        function runExternalCountdown(elementId) {
            let sec = 15; // Зовнішній таймер очікування
            window.activeExtInterval = setInterval(() => {
                sec--;
                const el = document.getElementById(elementId);
                if (el) el.innerText = sec;
                if (sec <= 0) {
                    clearInterval(window.activeExtInterval);
                    playBeep();
                }
            }, 1000);
        }

        function nextInteractiveStep() {
            if (window.activeExtInterval) clearInterval(window.activeExtInterval);
            currentStepIndex++;
            renderViewContent();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Початковий рендер
        renderRecipes();
    </script>
</body>
</html>
