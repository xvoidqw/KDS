<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Повноекранний Календар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f182b',
                        lightBg: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom smooth transition for calendar grid container */
        .calendar-transition {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
        }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0f182b] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-500 overflow-x-hidden">

    <header class="w-full px-3 sm:px-6 py-2.5 sm:py-4 flex flex-col sm:flex-row justify-between items-center border-b border-slate-200/60 dark:border-slate-800/60 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md gap-2.5 z-30 relative">
        <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
            <div class="flex items-center gap-2.5">
                <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></div>
                <h1 id="appTitle" class="text-base sm:text-xl font-bold tracking-tight">Календар</h1>
            </div>
            <!-- Live Clock without seconds -->
            <div id="liveClock" class="text-xs sm:text-sm font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-xl">
                00:00
            </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end flex-wrap">
            <div class="text-xs text-slate-400 font-medium hidden sm:block" id="currentSystemThemeText">Системна тема</div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <!-- Start Day Menu -->
                <div class="relative flex-1 sm:flex-initial">
                    <button id="startDayMenuBtn" class="w-full sm:w-auto bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-xl px-3 py-2 outline-none cursor-pointer transition hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-between sm:justify-start gap-2">
                        <span id="startDayLabelText" class="truncate">Тиждень з Пн</span>
                        <span class="text-[9px] opacity-70">▼</span>
                    </button>
                    <div id="startDayDropdown" class="absolute right-0 sm:right-auto sm:left-0 mt-2 w-48 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl py-2 hidden z-50 backdrop-blur-xl">
                        <button data-day="1" id="optMon" class="start-day-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">Понеділок</button>
                        <button data-day="0" id="optSun" class="start-day-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">Неділя</button>
                    </div>
                </div>

                <!-- Language Menu -->
                <div class="relative flex-1 sm:flex-initial">
                    <button id="langMenuBtn" class="w-full sm:w-auto bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-xl px-3 py-2 outline-none cursor-pointer transition hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-between sm:justify-start gap-2">
                        <span id="currentLangDisplay" class="truncate">🇺🇦 UA</span>
                        <span class="text-[9px] opacity-70">▼</span>
                    </button>
                    <div id="langDropdown" class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl py-2 hidden z-50 backdrop-blur-xl max-h-60 overflow-y-auto">
                        <button data-lang="uk" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇺🇦 Українська</button>
                        <button data-lang="en" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇬🇧 English</button>
                        <button data-lang="es" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇪🇸 Español</button>
                        <button data-lang="de" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇩🇪 Deutsch</button>
                        <button data-lang="fr" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇫🇷 Français</button>
                        <button data-lang="it" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇮🇹 Italiano</button>
                        <button data-lang="pl" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇵🇱 Polski</button>
                        <button data-lang="pt" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇵🇹 Português</button>
                        <button data-lang="ja" class="lang-option w-full text-left px-4 py-2 text-xs font-medium hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">🇯🇵 日本語</button>

                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full p-2 sm:p-4 lg:p-6 flex flex-col">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-3 sm:mb-4 gap-3 bg-white/70 dark:bg-slate-900/70 p-3 sm:p-4 rounded-2xl border border-slate-200/60 dark:border-slate-800/60 backdrop-blur-md shadow-sm">
            <div class="flex items-center justify-between sm:justify-start w-full sm:w-auto gap-3">
                <h2 id="monthYearDisplay" class="text-lg sm:text-2xl lg:text-3xl font-extrabold tracking-tight capitalize"></h2>
                <button id="todayBtn" class="px-3 py-1.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 text-xs font-bold rounded-xl transition cursor-pointer">Сьогодні</button>
            </div>
            
            <div class="flex items-center gap-2 self-end sm:self-auto">
                <button id="prevMonthBtn" class="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition cursor-pointer text-sm">
                    ❮
                </button>
                <button id="nextMonthBtn" class="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition cursor-pointer text-sm">
                    ❯
                </button>
            </div>
        </div>

        <!-- Fullscreen calendar grid container with smooth fade/scale transition -->
        <div id="calendarContainer" class="flex-1 flex flex-col bg-white/70 dark:bg-slate-900/70 rounded-2xl sm:rounded-3xl border border-slate-200/60 dark:border-slate-800/60 backdrop-blur-md shadow-xl overflow-hidden min-h-[450px] sm:min-h-[600px] calendar-transition">
            <div id="weekDaysHeader" class="grid grid-cols-7 border-b border-slate-200/60 dark:border-slate-800/60 bg-slate-50/50 dark:bg-slate-800/35 text-center py-2 sm:py-3.5 text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 flex-1 auto-rows-fr divide-x divide-y divide-slate-200/40 dark:divide-slate-800/40">
            </div>
        </div>
    </main>

    <div id="eventModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalDateTitle" class="text-lg font-bold"></h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg text-lg cursor-pointer">✕</button>
            </div>
            <div class="mb-4">
                <label id="eventLabelText" class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wide">Ваші нотатки або події на цей день</label>
                <textarea id="eventInput" rows="4" class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/80 rounded-2xl p-3 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-none" placeholder="Введіть нотатку..."></textarea>
            </div>
            <div class="flex justify-end gap-2">
                <button id="saveEventBtn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl transition shadow-lg shadow-indigo-500/25 cursor-pointer">Зберегти</button>
            </div>
        </div>
    </div>

    // --- STREAMING_CHUNK:Automatic system theme synchronization ---
    const htmlElement = document.documentElement;
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function applySystemTheme(e) {
        if (e.matches) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
    }
    applySystemTheme(mediaQuery);
    mediaQuery.addEventListener('change', applySystemTheme);

    // --- STREAMING_CHUNK:Live clock without seconds ---
    const liveClockEl = document.getElementById('liveClock');
    function updateLiveClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        liveClockEl.textContent = `${hours}:${minutes}`;
    }
    updateLiveClock();
    setInterval(updateLiveClock, 10000);

    // --- STREAMING_CHUNK:State management and local storage persistence ---
    let currentLang = localStorage.getItem('app_lang') || 'uk';
    let weekStartDay = parseInt(localStorage.getItem('week_start') ?? '1', 10);
    let savedEvents = JSON.parse(localStorage.getItem('app_events') || '{}');

    let todayDate = new Date();
    let displayMonth = todayDate.getMonth();
    let displayYear = todayDate.getFullYear();
    let selectedDateKey = null;

    const monthYearDisplay = document.getElementById('monthYearDisplay');
    const calendarGrid = document.getElementById('calendarGrid');
    const calendarContainer = document.getElementById('calendarContainer');
    const weekDaysHeader = document.getElementById('weekDaysHeader');
    const appTitle = document.getElementById('appTitle');
    const todayBtn = document.getElementById('todayBtn');
    const currentSystemThemeText = document.getElementById('currentSystemThemeText');

    const langMenuBtn = document.getElementById('langMenuBtn');
    const langDropdown = document.getElementById('langDropdown');
    const currentLangDisplay = document.getElementById('currentLangDisplay');

    const startDayMenuBtn = document.getElementById('startDayMenuBtn');
    const startDayDropdown = document.getElementById('startDayDropdown');
    const startDayLabelText = document.getElementById('startDayLabelText');
    const optMon = document.getElementById('optMon');
    const optSun = document.getElementById('optSun');

    const eventModal = document.getElementById('eventModal');
    const modalContent = document.getElementById('modalContent');
    const modalDateTitle = document.getElementById('modalDateTitle');
    const eventInput = document.getElementById('eventInput');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveEventBtn = document.getElementById('saveEventBtn');
    const eventLabelText = document.getElementById('eventLabelText');

    langMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('hidden');
        startDayDropdown.classList.add('hidden');
    });

    startDayMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startDayDropdown.classList.toggle('hidden');
        langDropdown.classList.add('hidden');
    });

    window.addEventListener('click', () => {
        langDropdown.classList.add('hidden');
        startDayDropdown.classList.add('hidden');
    });

    document.querySelectorAll('.lang-option').forEach(btn => {
        btn.addEventListener('click', () => {
            currentLang = btn.getAttribute('data-lang');
            localStorage.setItem('app_lang', currentLang);
            langDropdown.classList.add('hidden');
            updateTexts();
            renderCalendar();
        });
    });

    document.querySelectorAll('.start-day-option').forEach(btn => {
        btn.addEventListener('click', () => {
            weekStartDay = parseInt(btn.getAttribute('data-day'), 10);
            localStorage.setItem('week_start', weekStartDay);
            startDayDropdown.classList.add('hidden');
            updateTexts();
            renderCalendar();
        });
    });

    function updateTexts() {
        const t = translations[currentLang];
        appTitle.textContent = t.title;
        todayBtn.textContent = t.today;
        currentSystemThemeText.textContent = t.systemTheme;
        eventLabelText.textContent = t.noteLabel;
        eventInput.placeholder = t.placeholder;
        saveEventBtn.textContent = t.save;

        startDayLabelText.textContent = weekStartDay === 1 ? t.weekStartMon : t.weekStartSun;
        optMon.textContent = t.monday;
        optSun.textContent = t.sunday;
        currentLangDisplay.textContent = t.shortName;

        weekDaysHeader.innerHTML = '';
        const daysOrder = weekStartDay === 1 ? t.weekDaysMon : t.weekDaysSun;
        daysOrder.forEach(day => {
            const span = document.createElement('span');
            span.textContent = day;
            weekDaysHeader.appendChild(span);
        });
    }

    // --- STREAMING_CHUNK:Rendering adaptive calendar cells with fluid numbers & smooth transitions ---
    function renderCalendar() {
        const t = translations[currentLang];
        monthYearDisplay.textContent = `${t.months[displayMonth]} ${displayYear}`;

        let firstDayIndex = new Date(displayYear, displayMonth, 1).getDay();
        if (weekStartDay === 1) {
            firstDayIndex = (firstDayIndex + 6) % 7;
        }

        const totalDays = new Date(displayYear, displayMonth + 1, 0).getDate();
        const prevTotalDays = new Date(displayYear, displayMonth, 0).getDate();

        let gridHTML = '';

        for (let i = firstDayIndex; i > 0; i--) {
            const dayNum = prevTotalDays - i + 1;
            gridHTML += `
                <div class="p-1 sm:p-3 flex flex-col justify-between bg-slate-50/20 dark:bg-slate-900/20 text-slate-300 dark:text-slate-700 select-none overflow-hidden relative">
                    <div class="flex-1 flex items-center justify-center">
                        <span class="text-3xl sm:text-6xl md:text-7xl font-extrabold opacity-30">${dayNum}</span>
                    </div>
                </div>
            `;
        }

        for (let day = 1; day <= totalDays; day++) {
            const isToday = day === todayDate.getDate() && displayMonth === todayDate.getMonth() && displayYear === todayDate.getFullYear();
            const dateKey = `${displayYear}-${displayMonth}-${day}`;
            const noteText = savedEvents[dateKey];

            gridHTML += `
                <div class="day-cell p-1 sm:p-3 flex flex-col justify-between transition hover:bg-slate-100/80 dark:hover:bg-slate-800/60 cursor-pointer relative group overflow-hidden" data-datekey="${dateKey}" data-day="${day}" data-month="${t.months[displayMonth]}" data-year="${displayYear}">
                    <div class="flex-1 flex items-center justify-center relative z-10">
                        <span class="text-3xl sm:text-6xl md:text-7xl font-extrabold tracking-tight transition-transform group-hover:scale-105 ${isToday ? 'text-indigo-600 dark:text-indigo-400 drop-shadow-md' : 'text-slate-700 dark:text-slate-200'}">
                            ${day}
                        </span>
                    </div>
                    ${noteText ? `
                        <div class="mt-0.5 sm:mt-1 text-[9px] sm:text-xs bg-indigo-500/15 dark:bg-indigo-500/25 text-indigo-600 dark:text-indigo-300 px-1 sm:px-2 py-0.5 rounded-xl truncate font-semibold border border-indigo-500/30 relative z-10 shadow-sm">
                            📝 ${noteText}
                        </div>
                    ` : `<div class="mt-0.5 sm:mt-1 text-[9px] sm:text-xs text-transparent select-none">-</div>`}
                </div>
            `;
        }

        const totalCellsSoFar = firstDayIndex + totalDays;
        const remainingCells = totalCellsSoFar % 7 === 0 ? 0 : 7 - (totalCellsSoFar % 7);
        for (let i = 1; i <= remainingCells; i++) {
            gridHTML += `
                <div class="p-1 sm:p-3 flex flex-col justify-between bg-slate-50/20 dark:bg-slate-900/20 text-slate-300 dark:text-slate-700 select-none overflow-hidden relative">
                    <div class="flex-1 flex items-center justify-center">
                        <span class="text-3xl sm:text-6xl md:text-7xl font-extrabold opacity-30">${i}</span>
                    </div>
                </div>
            `;
        }

        calendarGrid.innerHTML = gridHTML;

        // Attach click listeners to generated day cells
        document.querySelectorAll('.day-cell').forEach(cell => {
            cell.addEventListener('click', () => {
                openModal(
                    cell.getAttribute('data-datekey'), 
                    cell.getAttribute('data-day'), 
                    cell.getAttribute('data-month'), 
                    cell.getAttribute('data-year')
                );
            });
        });
    }

    // --- STREAMING_CHUNK:Smooth transition animation wrapper for month switching ---
    function animateMonthChange(callback) {
        calendarContainer.style.opacity = '0';
        calendarContainer.style.transform = 'scale(0.98)';
        setTimeout(() => {
            callback();
            calendarContainer.style.opacity = '1';
            calendarContainer.style.transform = 'scale(1)';
        }, 150);
    }

    // --- STREAMING_CHUNK:Handling event modal logic ---
    function openModal(dateKey, day, monthName, year) {
        selectedDateKey = dateKey;
        modalDateTitle.textContent = `${day} ${monthName} ${year}`;
        eventInput.value = savedEvents[dateKey] || '';
        
        eventModal.classList.remove('hidden');
        setTimeout(() => {
            eventModal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }, 10);
    }

    function closeModal() {
        eventModal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => {
            eventModal.classList.add('hidden');
        }, 300);
    }

    saveEventBtn.addEventListener('click', () => {
        if (selectedDateKey) {
            const text = eventInput.value.trim();
            if (text) {
                savedEvents[selectedDateKey] = text;
            } else {
                delete savedEvents[selectedDateKey];
            }
            localStorage.setItem('app_events', JSON.stringify(savedEvents));
            renderCalendar();
            closeModal();
        }
    });

    closeModalBtn.addEventListener('click', closeModal);
    eventModal.addEventListener('click', (e) => {
        if (e.target === eventModal) closeModal();
    });

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
        animateMonthChange(() => {
            displayMonth--;
            if (displayMonth < 0) {
                displayMonth = 11;
                displayYear--;
            }
            renderCalendar();
        });
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
        animateMonthChange(() => {
            displayMonth++;
            if (displayMonth > 11) {
                displayMonth = 0;
                displayYear++;
            }
            renderCalendar();
        });
    });

    todayBtn.addEventListener('click', () => {
        animateMonthChange(() => {
            displayMonth = todayDate.getMonth();
            displayYear = todayDate.getFullYear();
            renderCalendar();
        });
    });

    updateTexts();
    renderCalendar();
</script>

</body>
</html>
